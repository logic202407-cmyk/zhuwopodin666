name: Build Word Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx==1.1.2
      - name: Download base real-screenshot report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/logic202407-cmyk/zhuwopodin666/actions/artifacts/7585908522/zip \
            -o base_report.zip
          unzip -o base_report.zip
          find . -name '*真实截图终稿.docx' -print
          cp "$(find . -name '*真实截图终稿.docx' | head -n 1)" '校园电动车充电安全监测与自动断电设计_课程设计报告_真实截图终稿.docx'
      - run: python patch_references.py
      - uses: actions/upload-artifact@v4
        with:
          name: word-report-team-references
          path: '*团队分工与参考文献已更新.docx'
