name: Build Word Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx==1.1.2
      - name: Download base real-screenshot report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf base_artifact
          mkdir -p base_artifact
          gh run download 27402170012 \
            -R logic202407-cmyk/zhuwopodin666 \
            -n word-report \
            -D base_artifact
          find base_artifact -name '*.docx' -print
          cp "$(find base_artifact -name '*真实截图终稿.docx' | head -n 1)" '校园电动车充电安全监测与自动断电设计_课程设计报告_真实截图终稿.docx'
      - run: python patch_references.py
      - uses: actions/upload-artifact@v4
        with:
          name: word-report-team-references
          path: '*团队分工与参考文献已更新.docx'
