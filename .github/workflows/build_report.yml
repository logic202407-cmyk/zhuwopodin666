name: Build Word Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python generate_report.py
      - run: python patch_references.py
      - uses: actions/upload-artifact@v4
        with:
          name: word-report-updated-references
          path: '*.docx'
